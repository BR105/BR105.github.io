<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" color="#fff">
<!-- 06 · Mascota — el gecko de perfil, trepando. Hocico en punta, cabeza alta,
     cuerpo que adelgaza hacia la cola y dos manos agarradas en angulos
     distintos. La cola se enrosca por encima del lomo. Es el que mas caracter
     tiene y el que mejor le sentaria a Gecko Games. -->
<defs>
  <mask id="ojo06">
    <rect width="120" height="120" fill="#fff"/>
    <circle cx="25" cy="44" r="7.2" fill="#000"/>
  </mask>
</defs>
<g fill="currentColor">
  <g mask="url(#ojo06)">
    <path d="M7 49
             C7 38 14 31 26 31
             C38 31 48 37 56 45
             C66 53 77 60 85 65
             C89 68 91 71 89 75
             C85 80 75 78 63 72
             C53 67 43 63 35 61
             C25 61 14 58 10 54
             C8 52 7 50 7 49 Z"/>
  </g>
  <!-- cola enroscada por encima del lomo -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M87 71 C105 75 115 59 106 45" stroke-width="12.5"/>
    <path d="M106 45 C98 35 86 39 86 48" stroke-width="8.5"/>
    <path d="M86 48 C86 54 93 56 95 50" stroke-width="5.5"/>
  </g>
  <!-- manos agarradas, en angulos distintos -->
  <g fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round">
    <path d="M32 61 L25 78"/>
    <path d="M64 72 L72 88"/>
  </g>
  <circle cx="16" cy="84" r="5.5"/><circle cx="23" cy="89" r="5.5"/><circle cx="30" cy="83" r="5.5"/>
  <circle cx="67" cy="96" r="5.5"/><circle cx="74" cy="100" r="5.5"/><circle cx="81" cy="94" r="5.5"/>
</g>
</svg>
