<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" color="#fff">
<!-- 04 · Curva — minimal de una sola forma: cabeza, cuerpo y cola en un unico
     trazo que nace gordo y muere en punta dentro de su propia espiral.
     Sin patas. Es el que mejor aguanta a 24 px; tambien el que menos dice
     "gecko" sin que nadie lo explique. -->
<defs>
  <mask id="ojo04">
    <rect width="120" height="120" fill="#fff"/>
    <circle cx="50" cy="25" r="5.4" fill="#000"/>
  </mask>
</defs>
<g mask="url(#ojo04)" fill="currentColor">
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M60 31 C80 41 90 59 86 78" stroke-width="25"/>
    <path d="M86 78 C82 95 65 105 49 101" stroke-width="19"/>
    <path d="M49 101 C35 97 28 83 34 70" stroke-width="13.5"/>
    <path d="M34 70 C38 63 47 64 48 71" stroke-width="8"/>
  </g>
  <!-- cabeza girada, hocico hacia arriba-izquierda -->
  <ellipse cx="56" cy="28" rx="18" ry="13.5" transform="rotate(-28 56 28)"/>
</g>
</svg>
