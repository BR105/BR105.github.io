<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" color="#fff">
<!-- 01 · Fiel — el gecko de siempre, simplificado de verdad: mismas
     proporciones, mismo giro de cabeza, misma cola enroscada. Cabeza y cuerpo
     son una sola silueta continua, con la cuna de la cabeza larga y apuntando
     a la izquierda y la muesca de la barbilla debajo. Se conservan los huecos
     entre patas y cuerpo, que es lo que lo hace leerse gecko y no mancha. -->
<defs>
  <mask id="ojo01">
    <rect width="120" height="120" fill="#fff"/>
    <circle cx="34" cy="36" r="4.9" fill="#000"/>
  </mask>
</defs>
<g transform="translate(-1,-1)" fill="currentColor">
  <g mask="url(#ojo01)">
    <path d="M20 40
             C20 33 28 27 39 26
             C48 25 56 26 64 30
             C78 36 86 48 87 63
             C88 80 81 93 73 95
             C66 97 60 92 56 83
             C53 74 51 64 50 56
             C49 50 45 47 38 47
             C30 47 20 45 20 40 Z"/>
  </g>
  <!-- cola enroscada -->
  <path d="M70 93 C77 106 68 117 53 117 C39 117 28 107 29 93 C29.5 86 31 82 34 79"
        fill="none" stroke="currentColor" stroke-width="12.5" stroke-linecap="round"/>
  <!-- patas: trazo grueso + almohadillas redondas -->
  <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round">
    <path d="M57 28 L56 15"/>
    <path d="M46 48 L37 54"/>
    <path d="M55 78 L46 81"/>
    <path d="M85 62 L98 62"/>
  </g>
  <g fill="currentColor">
    <circle cx="50" cy="11" r="5.3"/><circle cx="56" cy="7" r="5.3"/><circle cx="62" cy="12" r="5.3"/>
    <circle cx="29" cy="52" r="5.1"/><circle cx="30" cy="61" r="5.1"/><circle cx="38" cy="61" r="5.1"/>
    <circle cx="38" cy="79" r="5.3"/><circle cx="38" cy="88" r="5.3"/><circle cx="46" cy="88" r="5.3"/>
    <circle cx="105" cy="55" r="5.3"/><circle cx="106" cy="67" r="5.3"/><circle cx="97" cy="73" r="5.3"/>
  </g>
</g>
</svg>
