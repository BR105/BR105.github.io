<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" color="#fff">
<!-- 02 · Cola-G — el reintento del boceto original: cuerpo y cola trazan una G
     de una sola pasada. La cabeza girada remata arriba, la punta de la cola
     entra como barra de la G, y dos patas con almohadilla salen del aro para
     que se lea bicho y no solo letra. -->
<defs>
  <mask id="ojo02">
    <rect width="120" height="120" fill="#fff"/>
    <circle cx="95" cy="30" r="4.8" fill="#000"/>
  </mask>
</defs>
<g fill="currentColor">
  <g mask="url(#ojo02)">
    <!-- arco: cuerpo + cola -->
    <path d="M90 34 A42 42 0 1 0 94 82" fill="none" stroke="currentColor"
          stroke-width="18" stroke-linecap="round"/>
    <!-- punta de la cola entrando como barra, afilada hacia dentro -->
    <path d="M95 73 C101 74 102 89 95 90 L70 84 C65 83 65 76 70 75 Z"/>
    <!-- cabeza: ovalo girado, con hocico hacia arriba-derecha -->
    <ellipse cx="98" cy="29" rx="17" ry="12.5" transform="rotate(-32 98 29)"/>
  </g>
  <!-- dos patas, asimetricas -->
  <g fill="none" stroke="currentColor" stroke-width="8.5" stroke-linecap="round">
    <path d="M34 30 L23 20"/>
    <path d="M28 85 L17 95"/>
  </g>
  <circle cx="17" cy="15" r="5.2"/><circle cx="25" cy="12" r="5.2"/><circle cx="26" cy="22" r="5.2"/>
  <circle cx="12" cy="92" r="5.2"/><circle cx="13" cy="102" r="5.2"/><circle cx="21" cy="103" r="5.2"/>
</g>
</svg>
